# RT-DETR-R18 + Innovation 2 (FAGA: Frequency-Decoupled & Bounded Sub-Pixel Phase-Aligned Fusion)
# Compatible with Ultralytics YOLOv8.0.201 & DUT-Anti-UAV (nc=1)

nc: 1  # number of classes (UAV)
scales:
  l: [1.00, 1.00, 1024]

# Innovation 2 switch & hyperparameters
innovation_2:
  enabled: true
  module: FAGAFusion
  r_max: 1.5
  hidden_ratio: 0.25

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                        # 3-P2/4
  # [ch_out, block_type, block_nums, stage_num, act, variant]
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]         # 4-P2/4
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]        # 5-P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]        # 6-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]        # 7-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]           # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]                                # 9
  - [-1, 1, Conv, [256, 1, 1]]                              # 10, Y5, lateral_convs.0
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]              # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]            # 12 input_proj.1
  # Layer 13: Replace standard Concat with FAGAFusion (P5->P4 sub-pixel alignment & freq gating)
  - [[-2, -1], 1, FAGAFusion, [1, 1.5, 0.25, True]]         # 13 FAGA fusion (outputs 512 ch)
  - [-1, 3, RepC3, [256, 0.5]]                              # 14, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]                              # 15, Y4, lateral_convs.1
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]              # 16
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]            # 17 input_proj.0
  # Layer 18: Replace standard Concat with FAGAFusion (P4->P3 sub-pixel alignment & freq gating)
  - [[-2, -1], 1, FAGAFusion, [1, 1.5, 0.25, True]]         # 18 FAGA fusion (outputs 512 ch)
  - [-1, 3, RepC3, [256, 0.5]]                              # 19 (X3), fpn_blocks.1
  - [-1, 1, Conv, [256, 3, 2]]                              # 20, downsample_convs.0
  - [[-1, 15], 1, Concat, [1]]                              # 21 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]                              # 22 (F4), pan_blocks.0
  - [-1, 1, Conv, [256, 3, 2]]                              # 23, downsample_convs.1
  - [[-1, 10], 1, Concat, [1]]                              # 24 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]                              # 25 (F5), pan_blocks.1

  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # 26 Detect(P3, P4, P5)
