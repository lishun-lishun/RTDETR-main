# Parameters
nc: 80
scales:
  l: [1.00, 1.00, 1024]

# V2-FULL (Synergistic Joint Model): WCASFPv2 + DMBASCRepC3 + CAUADDecoder (+ optional UAV-Dense-O2O)
# 100% Coordinate-Preserving (ZERO grid_sample warping) across the entire pipeline!
innovation_v2_a:
  enabled: true
  aux_shallow_loss_weight: 0.20
innovation_v2_b:
  enabled: true
innovation_v2_c:
  enabled: true
innovation_8:
  enabled: true
  max_paste_per_img: 3
  paste_prob: 0.75
  max_obj_area: 0.04
  topk_o2m: 3
  o2m_weight: 0.25
  mal_gamma: 1.5

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 4-P2/4
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 5-P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 6-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 7-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 9
  - [-1, 1, Conv, [256, 1, 1]]  # 10, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[5, 6], 1, WCASFPv2, [256, 0.30, 0.10, 2.0, True]]  # 12 P3->P4 Haar Prior
  - [[-2, -1], 1, Concat, [1]] # 13
  - [-1, 3, RepC3, [256, 0.5]]  # 14, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 15, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [[4, 5], 1, WCASFPv2, [256, 0.30, 0.10, 2.0, True]]  # 17 P2->P3 Haar Prior
  - [[-2, -1], 1, Concat, [1]]  # 18
  - [-1, 3, DMBASCRepC3, [256, 0.5, 7, 0.35, 0.30, True]]  # 19 P3/8 Deblur + Signed Clutter Gate
  - [-1, 1, Conv, [256, 3, 2]]   # 20, downsample_convs.0

  - [[-1, 15], 1, Concat, [1]]  # 21
  - [-1, 3, DMBASCRepC3, [256, 0.5, 7, 0.35, 0.30, True]]  # 22 P4/16 Deblur + Signed Clutter Gate
  - [-1, 1, Conv, [256, 3, 2]]   # 23, downsample_convs.1

  - [[-1, 10], 1, Concat, [1]]  # 24
  - [-1, 3, RepC3, [256, 0.5]]    # 25, pan_blocks.1

  - [[19, 22, 25], 1, CAUADDecoder, [nc, 256, 300, 4, 8, 3]]  # 26 Coarse-to-Fine Annealed UAD Decoder
