# Exp 3: FasterNet PConv-Rep + ECA in Wide Stage 3/4 Branches (PF-DETR 2025/2026 + Slim-HRNet 2026)
# Slashes wide-branch backbone parameters & MACs while keeping Stage 1/2 ImageNet high-res BasicBlocks
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, HRNetPConvRep, [True]]   # 0 -> [P3(36), P4(72), P5(144)] (PConvRepBlock on >=72ch branches)
  - [0, 1, HRNetFeature, [0]]        # 1-P3/8
  - [0, 1, HRNetFeature, [1]]        # 2-P4/16
  - [0, 1, HRNetFeature, [2]]        # 3-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 4
  - [-1, 1, AIFI, [1024, 8]]                       # 5
  - [-1, 1, Conv, [256, 1, 1]]                     # 6

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 7
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 8
  - [[-2, -1], 1, Concat, [1]]                     # 9
  - [-1, 3, RepC3, [256, 0.5]]                     # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 3, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, Conv, [256, 3, 2]]                     # 16

  - [[-1, 11], 1, Concat, [1]]                     # 17
  - [-1, 3, RepC3, [256, 0.5]]                     # 18
  - [-1, 1, Conv, [256, 3, 2]]                     # 19

  - [[-1, 6], 1, Concat, [1]]                      # 20
  - [-1, 3, RepC3, [256, 0.5]]                     # 21

  - [[15, 18, 21], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 22
