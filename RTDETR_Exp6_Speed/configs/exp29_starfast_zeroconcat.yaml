# Exp 29: HRNetStarFast (Exp6 Exact Depth) + HiLoLinearAIFI + SoftplusZeroConcatFusion + RepC3(n=2) + HaarDownsample
# Unites Exp6's exact backbone depth with Exp16's winning Zero-Concat Neck & Exp22's fastest HiLoAIFI!
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, HRNetStarFast, [True]]   # 0 -> [P3(36), P4(72), P5(144)]
  - [0, 1, HRNetFeature, [0]]        # 1-P3/8
  - [0, 1, HRNetFeature, [1]]        # 2-P4/16
  - [0, 1, HRNetFeature, [2]]        # 3-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 4
  - [-1, 1, HiLoLinearAIFI, [512, 4]]              # 5
  - [-1, 1, Conv, [256, 1, 1]]                     # 6

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 7
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 8
  - [[-2, -1], 1, SoftplusZeroConcatFusion, [256]] # 9 Zero-Concat (cuts RepC3 input 512->256!)
  - [-1, 2, RepC3, [256, 0.5]]                     # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13
  - [[-2, -1], 1, SoftplusZeroConcatFusion, [256]] # 14
  - [-1, 2, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, HaarDownsample, [256]]                 # 16

  - [[11, -1], 1, SoftplusZeroConcatFusion, [256]] # 17
  - [-1, 2, RepC3, [256, 0.5]]                     # 18
  - [-1, 1, HaarDownsample, [256]]                 # 19

  - [[6, -1], 1, SoftplusZeroConcatFusion, [256]]  # 20
  - [-1, 2, RepC3, [256, 0.5]]                     # 21

  - [[15, 18, 21], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 22
