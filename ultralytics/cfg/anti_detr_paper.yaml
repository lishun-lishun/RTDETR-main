# Reproducible training protocol for the Anti-DETR ablation suite.
# These values pin RTDETR-main's RT-DETR/Paddle-aligned defaults so every model
# is trained and compared under exactly the same settings.
epochs: 100
patience: 0
batch: 4
imgsz: 640
cache: false
workers: 4
pretrained: true
optimizer: AdamW
seed: 0
deterministic: true
cos_lr: false
close_mosaic: 0
amp: false

lr0: 0.0001
lrf: 1.0
momentum: 0.9
weight_decay: 0.0001
# RTDETR-main treats this field as a number of warmup iterations.
warmup_epochs: 2000
warmup_momentum: 0.8
warmup_bias_lr: 0.1

max_det: 300
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
