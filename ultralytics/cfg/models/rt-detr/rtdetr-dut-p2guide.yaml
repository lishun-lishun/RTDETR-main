# DUT-Anti-UAV R18 candidate: fuse P2 detail into the P3 neck feature while
# keeping the original three-scale P3/P4/P5 RT-DETR decoder.
# This is a new, unvalidated experiment, not a paper-reproduction result.
nc: 1
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']]  # 0 P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]  # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]  # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                       # 3 P2/4
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]         # 4 P2/4
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]        # 5 P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]        # 6 P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]        # 7 P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 8 P5 projection
  - [-1, 1, AIFI, [1024, 8]]                                # 9 encoder
  - [-1, 1, Conv, [256, 1, 1]]                               # 10 P5 lateral

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]              # 11 -> P4
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]           # 12 P4 projection
  - [[-2, -1], 1, Concat, [1]]                              # 13
  - [-1, 3, RepC3, [256, 0.5]]                              # 14 P4 top-down
  - [-1, 1, Conv, [256, 1, 1]]                               # 15 P4 lateral

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]              # 16 -> P3
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]           # 17 P3 projection
  - [[-2, -1], 1, Concat, [1]]                              # 18
  - [-1, 3, RepC3, [256, 0.5]]                              # 19 P3 top-down

  # Narrow P2 guidance branch. The 160x160 feature is fused back into P3,
  # rather than being sent directly to the memory-intensive decoder.
  - [-1, 1, Conv, [128, 1, 1]]                               # 20 narrow P3
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]              # 21 -> P2
  - [4, 1, Conv, [128, 1, 1, None, 1, 1, False]]           # 22 P2 projection
  - [[-2, -1], 1, Concat, [1]]                              # 23
  - [-1, 3, RepC3, [128, 0.5]]                              # 24 P2 detail fusion
  - [-1, 1, Conv, [256, 3, 2]]                               # 25 -> P3
  - [[-1, 19], 1, Concat, [1]]                              # 26
  - [-1, 3, RepC3, [256, 0.5]]                              # 27 P3 output

  - [-1, 1, Conv, [256, 3, 2]]                               # 28 -> P4
  - [[-1, 15], 1, Concat, [1]]                              # 29
  - [-1, 3, RepC3, [256, 0.5]]                              # 30 P4 output
  - [-1, 1, Conv, [256, 3, 2]]                               # 31 -> P5
  - [[-1, 10], 1, Concat, [1]]                              # 32
  - [-1, 3, RepC3, [256, 0.5]]                              # 33 P5 output

  - [[27, 30, 33], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 34 P3/P4/P5
