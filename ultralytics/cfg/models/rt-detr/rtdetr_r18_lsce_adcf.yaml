# RT-DETR-R18 + LSCE + ADCF (E3)
# Combined plug-in: LSCE enhances P2 in the backbone (after layer 4), shifting all
# downstream layers by +1; ADCF then fuses F3 with F4 in the FPN (another +1).
# Decoder inputs are therefore [21, 24, 27] instead of the baseline [19, 22, 25].

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # [ch_out, block_type, block_nums, stage_num, act, variant]
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 4-P2
  - [-1, 1, LSCE, [32]] # 5-LSCE enhanced P2 (reads P2=4)
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 6-P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 7-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 8-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 10
  - [-1, 1, Conv, [256, 1, 1]]  # 11, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 13 input_proj.1 (P4=7)
  - [[-2, -1], 1, Concat, [1]] # 14
  - [-1, 3, RepC3, [256, 0.5]]  # 15, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 16, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 18 input_proj.0 (LSCE P3=6)
  - [[-2, -1], 1, Concat, [1]]  # 19 cat backbone P3
  - [-1, 3, RepC3, [256, 0.5]]    # X3 (20), fpn_blocks.1

  - [[20, 16], 1, ADCF, [64]] # 21-ADCF enhanced P3 (reads F3=20, Y4=16)

  - [-1, 1, Conv, [256, 3, 2]]   # 22, downsample_convs.0
  - [[-1, 16], 1, Concat, [1]]  # 23 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]    # F4 (24), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]   # 25, downsample_convs.1
  - [[-1, 11], 1, Concat, [1]]  # 26 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]    # F5 (27), pan_blocks.1

  - [[21, 24, 27], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)
