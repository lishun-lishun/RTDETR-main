# Exp 15: Neck Ablation A - FreqDecoupledBridge Only on Exp12 StarHRBalancedBackbone
# Isolates the gain of Semantic-Guided High-Frequency Denoising at P3 (36ch -> 256ch)
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, StarHRBalancedBackbone, [True]]  # 0
  - [0, 1, HRNetFeature, [0]]                # 1-P3/8  (80x80, 36ch)
  - [0, 1, HRNetFeature, [1]]                # 2-P4/16 (40x40, 72ch)
  - [0, 1, HRNetFeature, [2]]                # 3-P5/32 (20x20, 144ch)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 4 input_proj.2 (P5)
  - [-1, 1, AIFI, [512, 8]]                        # 5
  - [-1, 1, Conv, [256, 1, 1]]                     # 6, Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 7
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 8 input_proj.1 (P4)
  - [[-2, -1], 1, Concat, [1]]                     # 9
  - [-1, 2, RepC3, [256, 0.5]]                     # 10, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]                     # 11, Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [[1, 2], 1, FreqDecoupledBridge, [256]]        # 13 Semantic-Guided HF Denoising Bridge (P3 + P4 -> 256)
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 2, RepC3, [256, 0.5]]                     # 15, fpn_blocks.1
  - [-1, 1, Conv, [256, 3, 2]]                     # 16, downsample_convs.0

  - [[-1, 11], 1, Concat, [1]]                     # 17
  - [-1, 2, RepC3, [256, 0.5]]                     # 18, pan_blocks.0
  - [-1, 1, Conv, [256, 3, 2]]                     # 19, downsample_convs.1

  - [[-1, 6], 1, Concat, [1]]                      # 20
  - [-1, 2, RepC3, [256, 0.5]]                     # 21, pan_blocks.1

  - [[15, 18, 21], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 22
