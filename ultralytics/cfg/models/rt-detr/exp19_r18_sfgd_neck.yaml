# Exp 19: Standalone Innovation 2 Ablation - Original RT-DETR-R18 Backbone + Full SFGD-Neck
# Proves SFGD-Neck is independently effective & plug-and-play on vanilla RT-DETR-R18 (PResNet18-vd)!
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # Exact original RT-DETR-R18 (PResNet18-vd) backbone
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']]            # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]            # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]            # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                                   # 3-P2/4
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]                    # 4-P2/4  (160x160, 64ch)
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]                   # 5-P3/8  (80x80, 128ch)
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]                   # 6-P4/16 (40x40, 256ch)
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]                   # 7-P5/32 (20x20, 512ch)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8  input_proj.2 (P5: 512 -> 256)
  - [-1, 1, DualFreqAIFI, [512, 8]]                # 9  Dual-Frequency Enhanced AIFI
  - [-1, 1, Conv, [256, 1, 1]]                     # 10 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 12 input_proj.1 (P4: 256 -> 256)
  - [[-2, -1], 1, SoftplusZeroConcatFusion, [256]] # 13 Zero-Concat Gated Fusion
  - [-1, 3, RepC3, [256, 0.5]]                     # 14 fpn_blocks.0 (256 -> 256)
  - [-1, 1, Conv, [256, 1, 1]]                     # 15 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 16
  - [[5, 6], 1, FreqDecoupledBridge, [256]]        # 17 Semantic-Guided HF Denoising Bridge (P3+P4 -> 256)
  - [[-2, -1], 1, SoftplusZeroConcatFusion, [256]] # 18 Zero-Concat Gated Fusion
  - [-1, 3, RepC3, [256, 0.5]]                     # 19 fpn_blocks.1
  - [-1, 1, HaarDownsample, [256]]                 # 20 Alias-Free 2D Haar PAN Downsample (P3->P4)

  - [[15, -1], 1, SoftplusZeroConcatFusion, [256]] # 21 Zero-Concat Gated Fusion (Y4 screens P3_down)
  - [-1, 3, RepC3, [256, 0.5]]                     # 22 pan_blocks.0
  - [-1, 1, HaarDownsample, [256]]                 # 23 Alias-Free 2D Haar PAN Downsample (P4->P5)

  - [[10, -1], 1, SoftplusZeroConcatFusion, [256]] # 24 Zero-Concat Gated Fusion (Y5 screens P4_down)
  - [-1, 3, RepC3, [256, 0.5]]                     # 25 pan_blocks.1

  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 26 Detect(P3, P4, P5)
