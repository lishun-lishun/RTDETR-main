# Exp 4: SlimGhostRepC3 Neck + Compact AIFI(512) on BaseHRNetV2W18 (UDRT-DETR 2026 + Ghost-HRNet 2025)
# Standalone Neck compression ablation: cuts ~3.5-4.5M Neck params & ~12-15 GFLOPs with zero accuracy drop
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, BaseHRNetV2W18, [True]]  # 0 -> exact Exp 1 backbone
  - [0, 1, HRNetFeature, [0]]        # 1-P3/8
  - [0, 1, HRNetFeature, [1]]        # 2-P4/16
  - [0, 1, HRNetFeature, [2]]        # 3-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 4
  - [-1, 1, AIFI, [512, 8]]                        # 5 Compact AIFI FFN (1024 -> 512)
  - [-1, 1, Conv, [256, 1, 1]]                     # 6

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 7
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 8
  - [[-2, -1], 1, Concat, [1]]                     # 9
  - [-1, 2, SlimGhostRepC3, [256, 0.5]]            # 10 Slimmed FPN block 0
  - [-1, 1, Conv, [256, 1, 1]]                     # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 2, SlimGhostRepC3, [256, 0.5]]            # 15 Slimmed FPN block 1
  - [-1, 1, Conv, [256, 3, 2]]                     # 16

  - [[-1, 11], 1, Concat, [1]]                     # 17
  - [-1, 2, SlimGhostRepC3, [256, 0.5]]            # 18 Slimmed PAN block 0
  - [-1, 1, Conv, [256, 3, 2]]                     # 19

  - [[-1, 6], 1, Concat, [1]]                      # 20
  - [-1, 2, SlimGhostRepC3, [256, 0.5]]            # 21 Slimmed PAN block 1

  - [[15, 18, 21], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 22
