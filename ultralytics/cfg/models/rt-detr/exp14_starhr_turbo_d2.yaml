# Exp 14: StarHR-Turbo-D2 (StarHRTurboBackbone + 192-dim RepC3(n=2) + 2-Layer 192-dim Decoder)
# Targets ~310 fused layers, ~5.3M params (-73% vs R18), matching/beating RT-DETR-R18 on BOTH FP16 & FP32!
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, StarHRTurboBackbone, [True]]  # 0 -> Stage1=2, Stage3=2, Stage4=1 + widened StarFastBlock
  - [0, 1, HRNetFeature, [0]]             # 1-P3/8
  - [0, 1, HRNetFeature, [1]]             # 2-P4/16
  - [0, 1, HRNetFeature, [2]]             # 3-P5/32

head:
  - [-1, 1, Conv, [192, 1, 1, None, 1, 1, False]]  # 4
  - [-1, 1, AIFI, [512, 8]]                        # 5
  - [-1, 1, Conv, [192, 1, 1]]                     # 6

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 7
  - [2, 1, Conv, [192, 1, 1, None, 1, 1, False]]   # 8
  - [[-2, -1], 1, Concat, [1]]                     # 9
  - [-1, 2, RepC3, [192, 0.5]]                     # 10
  - [-1, 1, Conv, [192, 1, 1]]                     # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [1, 1, Conv, [192, 1, 1, None, 1, 1, False]]   # 13
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 2, RepC3, [192, 0.5]]                     # 15
  - [-1, 1, Conv, [192, 3, 2]]                     # 16

  - [[-1, 11], 1, Concat, [1]]                     # 17
  - [-1, 2, RepC3, [192, 0.5]]                     # 18
  - [-1, 1, Conv, [192, 3, 2]]                     # 19

  - [[-1, 6], 1, Concat, [1]]                      # 20
  - [-1, 2, RepC3, [192, 0.5]]                     # 21

  - [[15, 18, 21], 1, RTDETRDecoder, [nc, 192, 150, 4, 8, 2]]  # 22 Native 2-layer compact Decoder!
