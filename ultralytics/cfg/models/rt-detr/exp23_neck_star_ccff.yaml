# Exp 23: Neck Arena 4 - Unified StarCCFF Neck (StarC3 + SoftplusZeroConcatFusion) on Exp12 Backbone
# Cuts ~1.8M Neck params while unifying Backbone & Neck in StarNet high-dim nonlinear space
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, StarHRBalancedBackbone, [True]]  # 0
  - [0, 1, HRNetFeature, [0]]                # 1-P3/8
  - [0, 1, HRNetFeature, [1]]                # 2-P4/16
  - [0, 1, HRNetFeature, [2]]                # 3-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 4
  - [-1, 1, AIFI, [512, 8]]                        # 5
  - [-1, 1, Conv, [256, 1, 1]]                     # 6 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 7
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 8
  - [[-2, -1], 1, SoftplusZeroConcatFusion, [256]] # 9
  - [-1, 2, StarC3, [256, 0.5]]                    # 10 StarNet C3 (256->256)
  - [-1, 1, Conv, [256, 1, 1]]                     # 11 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13
  - [[-2, -1], 1, SoftplusZeroConcatFusion, [256]] # 14
  - [-1, 2, StarC3, [256, 0.5]]                    # 15
  - [-1, 1, HaarDownsample, [256]]                 # 16

  - [[11, -1], 1, SoftplusZeroConcatFusion, [256]] # 17
  - [-1, 2, StarC3, [256, 0.5]]                    # 18
  - [-1, 1, HaarDownsample, [256]]                 # 19

  - [[6, -1], 1, SoftplusZeroConcatFusion, [256]]  # 20
  - [-1, 2, StarC3, [256, 0.5]]                    # 21

  - [[15, 18, 21], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 22
