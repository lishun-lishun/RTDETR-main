# Exp 8: RepGhostC3 + Alias-Free HaarDownsample PAN on 100% ImageNet-Pretrained HRNetPruneS4
# Targets high-IoU tiny UAV localization (mAP75 / AP_small) with hardware-friendly RepGhost Neck + Wavelet PAN
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, HRNetPruneS4, [True]]    # 0 -> [P3(36), P4(72), P5(144)]
  - [0, 1, HRNetFeature, [0]]        # 1-P3/8
  - [0, 1, HRNetFeature, [1]]        # 2-P4/16
  - [0, 1, HRNetFeature, [2]]        # 3-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 4
  - [-1, 1, AIFI, [512, 8]]                        # 5
  - [-1, 1, Conv, [256, 1, 1]]                     # 6

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 7
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 8
  - [[-2, -1], 1, Concat, [1]]                     # 9
  - [-1, 2, RepGhostC3, [256, 0.5]]                # 10 RepGhost FPN 0
  - [-1, 1, Conv, [256, 1, 1]]                     # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 2, RepGhostC3, [256, 0.5]]                # 15 RepGhost FPN 1
  - [-1, 1, HaarDownsample, [256]]                 # 16 Alias-free 2D Haar DWT downsample (P3->P4)

  - [[-1, 11], 1, Concat, [1]]                     # 17
  - [-1, 2, RepGhostC3, [256, 0.5]]                # 18 RepGhost PAN 0
  - [-1, 1, HaarDownsample, [256]]                 # 19 Alias-free 2D Haar DWT downsample (P4->P5)

  - [[-1, 6], 1, Concat, [1]]                      # 20
  - [-1, 2, RepGhostC3, [256, 0.5]]                # 21 RepGhost PAN 1

  - [[15, 18, 21], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 22
