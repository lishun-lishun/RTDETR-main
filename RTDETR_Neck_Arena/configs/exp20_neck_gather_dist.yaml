# Exp 20: Neck Arena 1 - Tri-Scale Gather-and-Distribute Consensus Neck on Exp12 Backbone
# Eliminates multi-hop FPN/PAN attenuation via 1-hop tri-scale GatherDistributeGate injection
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, StarHRBalancedBackbone, [True]]  # 0
  - [0, 1, HRNetFeature, [0]]                # 1-P3/8  (36ch)
  - [0, 1, HRNetFeature, [1]]                # 2-P4/16 (72ch)
  - [0, 1, HRNetFeature, [2]]                # 3-P5/32 (144ch)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]        # 4 P5_proj
  - [-1, 1, AIFI, [512, 8]]                              # 5
  - [-1, 1, Conv, [256, 1, 1]]                           # 6 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]           # 7
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 8 P4_proj
  - [[8, 1, 6], 1, GatherDistributeGate, [256]]          # 9 Tri-scale consensus injected into P4!
  - [[-3, -1], 1, Concat, [1]]                           # 10 (7 + 9)
  - [-1, 2, RepC3, [256, 0.5]]                           # 11
  - [-1, 1, Conv, [256, 1, 1]]                           # 12 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]           # 13
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 14 P3_proj
  - [[14, 2, 6], 1, GatherDistributeGate, [256]]         # 15 Tri-scale consensus injected into P3!
  - [[-3, -1], 1, Concat, [1]]                           # 16 (13 + 15)
  - [-1, 2, RepC3, [256, 0.5]]                           # 17 FPN_P3
  - [-1, 1, Conv, [256, 3, 2]]                           # 18

  - [[-1, 12], 1, Concat, [1]]                           # 19
  - [-1, 2, RepC3, [256, 0.5]]                           # 20 PAN_P4
  - [-1, 1, Conv, [256, 3, 2]]                           # 21

  - [[-1, 6], 1, Concat, [1]]                            # 22
  - [-1, 2, RepC3, [256, 0.5]]                           # 23 PAN_P5

  - [[17, 20, 23], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 24
