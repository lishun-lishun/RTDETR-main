# Exp 33: Exp28 + FCGHaarDownsample (Nonlinear Frequency-Contrast Gated Haar PAN)
# Strictly non-equivalent to 2x2 stride-2 linear convolution!
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, HRNetStarFast, [True]]     # 0 -> Stage1=4, Stage3=4x3, Stage4=2x3
  - [0, 1, HRNetFeature, [0]]          # 1-P3/8
  - [0, 1, HRNetFeature, [1]]          # 2-P4/16
  - [0, 1, HRNetFeature, [2]]          # 3-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 4
  - [-1, 1, HiLoLinearAIFI, [512, 4]]              # 5
  - [-1, 1, Conv, [256, 1, 1]]                     # 6

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 7
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 8
  - [[-2, -1], 1, Concat, [1]]                     # 9
  - [-1, 2, RepC3, [256, 0.5]]                     # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [1, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 2, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, FCGHaarDownsample, [256]]              # 16 Nonlinear Frequency-Contrast Gated Haar

  - [[-1, 11], 1, Concat, [1]]                     # 17
  - [-1, 2, RepC3, [256, 0.5]]                     # 18
  - [-1, 1, FCGHaarDownsample, [256]]              # 19 Nonlinear Frequency-Contrast Gated Haar

  - [[-1, 6], 1, Concat, [1]]                      # 20
  - [-1, 2, RepC3, [256, 0.5]]                     # 21

  - [[15, 18, 21], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 22
